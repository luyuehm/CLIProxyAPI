# remote-management:
#   allow-remote: true
#   secret-key: "<与 .env 中 CPA_MANAGEMENT_KEY 一致>"
#
# usage-statistics-enabled: true
# redis-usage-queue-retention-seconds: 60

# 本文件保留作为企业版配置参考，实际部署时无需修改。