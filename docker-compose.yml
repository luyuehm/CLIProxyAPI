services:
  cli-proxy-api:
    # RIC-460: pinned to the locally-built contentfilter image (NULL-column
    # export fix + HTTP-first audit writer). Using a direct tag (not an env var) so a stale
    # CLI_PROXY_IMAGE in .env cannot pull the old remote image over this
    # deployment. The previous pin (deploy-ric457 = stable-v7.2.147, commit
    # 17a65ee5) predated the contentfilter feature and had no export handler.
    # RIC-578: stable-v7.2.156 carries the content-filter JSON-corruption fix
    # (PII masking no longer emits a bare `\*` invalid escape).
    # RIC-750: v7.3.1 enterprise merge — upstream 44e62bc8 + KEEPER/contentfilter
    # (PII masking, audit export, KEEPER license linkage) preserved intact.
    image: cli-proxy-api:stable-v7.3.1
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
      # RIC-460: enable the content filter + audit export. CPA reads
      # content_filter_rules / content_filter_logs read-only from the mounted
      # KEEPER volume (below). Audit rows are shipped to KEEPER over HTTP
      # (POST /api/v1/contentfilter/logs/ingest) so KEEPER remains the single
      # writer of app.db — CPA never opens it writable, so owner drift to host
      # uid 501 / "readonly database" cannot recur.
      CPA_CONTENT_FILTER_ENABLED: "1"
      CPA_CONTENT_FILTER_AUDIT_KEEPER_URL: "http://host.docker.internal:4320"
      CPA_CONTENT_FILTER_AUDIT_KEEPER_KEY: "LUyao123@"
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-/Users/macbook/cli-proxy-config/config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
      # RIC-460: expose the KEEPER SQLite volume read-only at the content
      # filter's default host-DB path. The rule syncer and export handler only
      # ever READ content_filter_rules / content_filter_logs; audit logs are
      # shipped to KEEPER over HTTP so KEEPER stays the single writer.
      # Mounting :ro makes a second writer impossible at the mount layer.
      - enterprise-keeper_keeper-data:/var/lib/docker/volumes/enterprise-keeper_keeper-data/_data:ro
    restart: unless-stopped

volumes:
  enterprise-keeper_keeper-data:
    external: true
